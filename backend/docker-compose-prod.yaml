services:
# === backend === #
  backend:
    build: 
      context: backend/
      target: production
    container_name: backend
    depends_on:
      - db
    networks:
      - backend
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_HOST=${DB_HOST}
  
  db:
    image: postgres:18
    container_name: db
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_DATABASE}    
    volumes:
      - postgres_data:/var/lib/postgresql_dev/data
    networks:
      - backend

# === routing === #
  nginx:
    image: nginx:1-alpine
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template
    env_file:
      - .env
    networks:
      - backend

  cloudflare:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - "TUNNEL_TOKEN=${CLOUDFLARE_TOKEN}"
    networks:
      - backend

# === settings === #
volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
